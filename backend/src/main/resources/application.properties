# Master (Escrita - POST, PUT, DELETE)
spring.datasource.master.jdbc-url=jdbc:postgresql://postgres_master:5432/products_db
spring.datasource.master.username=postgres
spring.datasource.master.password=postgres
spring.datasource.master.driver-class-name=org.postgresql.Driver

# Réplica / Slave (Leitura - GET)
spring.datasource.replica.jdbc-url=jdbc:postgresql://postgres_replica:5432/products_db
spring.datasource.replica.username=postgres
spring.datasource.replica.password=postgres
spring.datasource.replica.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms