
name: CI - Build and Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: products_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d products_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Executar testes e gerar pacote
        working-directory: backend
        env:
          SPRING_DATASOURCE_MASTER_JDBCURL: jdbc:postgresql://localhost:5432/products_db
          SPRING_DATASOURCE_MASTER_USERNAME: postgres
          SPRING_DATASOURCE_MASTER_PASSWORD: password

          SPRING_DATASOURCE_REPLICA_JDBCURL: jdbc:postgresql://localhost:5432/products_db
          SPRING_DATASOURCE_REPLICA_USERNAME: postgres
          SPRING_DATASOURCE_REPLICA_PASSWORD: password

          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

        run: mvn clean verify

      - name: Construir imagem Docker
        run: docker build -t backend-api ./backend
